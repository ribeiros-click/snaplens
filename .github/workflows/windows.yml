# Compila o SnapLens para Windows (instalador + zip). Em tags v*, anexa os arquivos à release do GitHub.
name: Windows build

on:
  push:
    tags: ["v*"]
    paths-ignore: ["server/**"]
  pull_request:
    paths-ignore: ["server/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # histórico completo: o nº do build é a contagem de commits

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build
        shell: pwsh
        env:
          ONEDRIVE_CLIENT_ID: ${{ secrets.ONEDRIVE_CLIENT_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          # Versão vem do arquivo VERSION; numa tag v*, a tag manda.
          if ($env:GITHUB_REF_TYPE -eq "tag") { ./windows/build.ps1 -Version $env:GITHUB_REF_NAME.TrimStart("v") } else { ./windows/build.ps1 }

      - uses: actions/upload-artifact@v4
        with:
          name: SnapLens-windows
          path: |
            windows/dist/SnapLens-Setup.exe
            windows/dist/SnapLens-windows-x64.zip

      - name: Attach to release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:GITHUB_REF_NAME 2>$null
          if ($LASTEXITCODE -ne 0) { gh release create $env:GITHUB_REF_NAME --title $env:GITHUB_REF_NAME --generate-notes }
          gh release upload $env:GITHUB_REF_NAME windows/dist/SnapLens-Setup.exe windows/dist/SnapLens-windows-x64.zip --clobber
