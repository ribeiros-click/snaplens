# Compila o SnapLens para Windows (instalador + zip). Em cada push no main (merge de PR) publica a release
# v<VERSION> com os arquivos; numa tag v*, anexa à release da tag. Em PRs, só gera o artefato para teste.
name: Windows build

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["server/**"]
  pull_request:
    paths-ignore: ["server/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # histórico completo: o nº do build é a contagem de commits

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build
        shell: pwsh
        env:
          ONEDRIVE_CLIENT_ID: ${{ secrets.ONEDRIVE_CLIENT_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          # Versão vem do arquivo VERSION; numa tag v*, a tag manda.
          if ($env:GITHUB_REF_TYPE -eq "tag") { ./windows/build.ps1 -Version $env:GITHUB_REF_NAME.TrimStart("v") } else { ./windows/build.ps1 }

      - uses: actions/upload-artifact@v4
        with:
          name: SnapLens-windows
          path: |
            windows/dist/SnapLens-Setup.exe
            windows/dist/SnapLens-windows-x64.zip

      - name: Publish release
        if: github.ref_type == 'tag' || github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # main: release v<VERSION> (criada no primeiro merge da versão; merges seguintes atualizam os arquivos).
          $tag = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME } else { "v" + (Get-Content VERSION -Raw).Trim() }
          # Notas: a seção da versão no CHANGELOG.md (senão, as notas automáticas do GitHub).
          $notes = Join-Path $env:RUNNER_TEMP "notes.md"
          python Tools/release_notes.py $tag.TrimStart("v") $notes
          $hasNotes = (Test-Path $notes) -and ((Get-Item $notes).Length -gt 0)
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            # O workflow do macOS roda em paralelo e também pode criar a release.
            if ($hasNotes) { gh release create $tag --title ("SnapLens " + $tag.TrimStart("v")) --notes-file $notes --target $env:GITHUB_SHA }
            else { gh release create $tag --title ("SnapLens " + $tag.TrimStart("v")) --generate-notes --target $env:GITHUB_SHA }
            if ($LASTEXITCODE -ne 0) { Write-Host "Release $tag já foi criada pelo outro workflow." }
          }
          gh release upload $tag windows/dist/SnapLens-Setup.exe windows/dist/SnapLens-windows-x64.zip --clobber
          exit $LASTEXITCODE
